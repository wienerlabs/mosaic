[workspace]
resolver = "2"
members = [
    "crates/mosaic-core",
    "crates/mosaic-zk-primitives",
    "crates/mosaic-groth16",
    "crates/mosaic-halo2",
    "crates/mosaic-hyperplonk",
    "crates/mosaic-plonk",
    "crates/mosaic-stark",
    "crates/mosaic-nova",
    "crates/mosaic-serde",
    "crates/mosaic-chunked",
    "crates/mosaic-program",
    "crates/mosaic-sdk",
    "crates/mosaic-bench",
    "crates/mosaic-fuzz",
    "tests/differential",
]
default-members = [
    "crates/mosaic-core",
    "crates/mosaic-groth16",
    "crates/mosaic-serde",
    "crates/mosaic-chunked",
    "crates/mosaic-sdk",
]

[workspace.package]
version = "0.9.1-halo2-multi-column-kzg-binding"
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0 OR MIT"
authors = ["Wiener Labs <hello@wienerlabs.com>"]
homepage = "https://github.com/wienerlabs/mosaic"
repository = "https://github.com/wienerlabs/mosaic"
documentation = "https://docs.rs/mosaic-core"
readme = "README.md"
keywords = ["solana", "zk", "groth16", "verifier", "cryptography"]
categories = ["cryptography", "no-std"]

[workspace.dependencies]
# Workspace member crates
mosaic-core = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-core", default-features = false }
mosaic-zk-primitives = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-zk-primitives", default-features = false }
mosaic-groth16 = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-groth16", default-features = false }
mosaic-plonk = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-plonk", default-features = false }
mosaic-hyperplonk = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-hyperplonk", default-features = false }
mosaic-halo2 = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-halo2", default-features = false }
mosaic-stark = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-stark", default-features = false }
mosaic-nova = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-nova", default-features = false }
mosaic-serde = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-serde", default-features = false }
mosaic-chunked = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-chunked", default-features = false }
mosaic-program = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-program" }
mosaic-sdk = { version = "0.9.1-halo2-multi-column-kzg-binding", path = "crates/mosaic-sdk" }

# Solana — pinned to 2.x; Solana 3.0 CLI is backward-compatible with 2.x program SDK.
# We deliberately avoid the unstable 3.x API surface during phase 1 to keep MSRV stable.
solana-program = { version = "2.1.0", default-features = false }
# alt_bn128 + keccak + poseidon got split out of solana-program in 2.x — depend explicitly.
solana-bn254 = { version = "2.2", default-features = false }
solana-keccak-hasher = { version = "2.2", default-features = false }
solana-poseidon = { version = "2.3", default-features = false }

# Arkworks — host-side cryptographic correctness oracle and reference impl.
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
ark-groth16 = { version = "0.5.0", default-features = false }
ark-relations = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false, features = ["derive"] }
ark-std = { version = "0.5.0", default-features = false }

# Serialization
borsh = { version = "1.5.1", default-features = false, features = ["derive"] }
serde = { version = "1.0.210", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.128", default-features = false, features = ["alloc"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }

# Error handling
thiserror = { version = "1.0.69", default-features = false }

# Memory / safety primitives
bytemuck = { version = "1.18.0", features = ["derive"] }
zeroize = { version = "1.8.1", default-features = false, features = ["derive"] }
subtle = { version = "2.6.1", default-features = false }
arrayvec = { version = "0.7.6", default-features = false }
num-bigint = { version = "0.4.6", default-features = false }

# Logging — feature-gated, never enabled by default in library crates.
log = { version = "0.4.22", default-features = false }
tracing = { version = "0.1.40", default-features = false }

# Host-side hashes (mirror Solana hashv syscall semantics for differential
# testing). Never compiled into SBF builds.
sha2 = { version = "0.10.8", default-features = false }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
light-poseidon = "0.3.0"

# Testing & fuzzing
criterion = { version = "0.5.1", default-features = false }
proptest = "1.5.0"
arbitrary = { version = "1.3.2", features = ["derive"] }
libfuzzer-sys = "0.4.7"
honggfuzz = "0.5.56"

# SDK
solana-sdk = "2.1.0"
solana-client = "2.1.0"
solana-program-test = "2.1.0"
anyhow = "1.0.89"
tokio = { version = "1.40.0", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# === Layered policy (see docs/lint-policy.md for full rationale) ===
#
# Layer 1 — correctness + suspicious: hard-deny everywhere. CI uses
# `-D warnings` so these always fail the build.
correctness = { level = "deny", priority = -2 }
suspicious  = { level = "deny", priority = -2 }
#
# Layer 2 — pedantic + nursery + cargo: kept at `warn` so they're visible
# in clippy output and audit firms can audit suppressions. CI demotes these
# back via `-W clippy::pedantic -W clippy::nursery -W clippy::cargo` so they
# don't fail the build, but they remain visible in the log and any new
# noise stands out at PR review time.
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
#
# Layer 3 — explicit denials for panic-paths that would break on-chain.
# These override pedantic-warn. Test / bench / fuzz crates that legitimately
# need them must `#[allow(...)]` at module level with a written reason.
todo = "deny"
unimplemented = "deny"
#
# Layer 4 — soft warns kept allow-by-default because they fire on every
# test module. The `disallowed_methods` clippy.toml entry remains empty for
# now; when library code surface stabilizes we'll add a scoped disallow
# list with crate-specific exceptions (tracked in issue #32).
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
arithmetic_side_effects = "allow"
indexing_slicing = "allow"
missing_panics_doc = "allow"
disallowed_macros = "allow"

[profile.release]
# opt-level = "z" — size-optimized. Chosen over `= 3` after measuring
# SBF binary growth from Phase-3 bodies crossed 97% of Solana's 1 MB
# program limit at `= 3`. The size optimizer favors fewer inlining
# decisions, shared tail call destinations, and smaller code-generation
# options at the cost of runtime CU. On-chain CU re-measured 2026-04-23:
# Groth16 +4.1 % (83 574), Groth16 batch +12.0 % (258 397), KZG-PLONK
# +29.5 % (968 457; hard cap raised 800K → 1 100K). PLONK's polynomial-
# heavy path is most affected; Groth16's pairing-dominated path absorbs
# the tradeoff cleanly. See ADR-0005 "Re-measurement" note and
# bpf-bench baseline block for per-system drift deltas.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"

[profile.bench]
# Benchmarks prioritize runtime accuracy over binary size — keep the
# speed-optimized profile for host-side benches so microbenchmarks
# reflect production-equivalent arithmetic throughput.
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

# SBF target inherits release profile. The `opt-level = "z"` setting
# above is specifically chosen for the Solana program binary —
# cargo-build-sbf reads this profile and the size reduction directly
# impacts deploy feasibility under the 1 MB on-chain limit.

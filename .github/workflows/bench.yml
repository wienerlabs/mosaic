name: bench

on:
  pull_request:
    paths:
      - "crates/mosaic-core/**"
      - "crates/mosaic-groth16/**"
      - "crates/mosaic-plonk/**"
      - "crates/mosaic-hyperplonk/**"
      - "crates/mosaic-halo2/**"
      - "crates/mosaic-nova/**"
      - "crates/mosaic-stark/**"
      - "crates/mosaic-zk-primitives/**"
      - "crates/mosaic-bench/**"
      - ".github/workflows/bench.yml"
  push:
    branches: [main]
    paths:
      - "crates/mosaic-core/**"
      - "crates/mosaic-groth16/**"
      - "crates/mosaic-plonk/**"
      - "crates/mosaic-hyperplonk/**"
      - "crates/mosaic-halo2/**"
      - "crates/mosaic-nova/**"
      - "crates/mosaic-stark/**"
      - "crates/mosaic-zk-primitives/**"
      - "crates/mosaic-bench/**"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Host-side criterion benches — both Groth16 (production) and
  # Phase-3 scaffold-acceptance benches. Wall-clock numbers are the
  # canary for CPU regressions before they hit on-chain CU.
  # ─────────────────────────────────────────────────────────────────
  criterion:
    name: criterion (host)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bench:
          - groth16_host
          - phase3_host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p mosaic-bench --bench ${{ matrix.bench }} -- --output-format bencher | tee output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-output-${{ matrix.bench }}
          path: output.txt

  # ─────────────────────────────────────────────────────────────────
  # On-chain CU regression bench — drives the SBF program through
  # solana-program-test and parses CU consumption from program logs.
  # Hard-cap exceedance fails CI (ADR-0005); baseline drift logs a
  # WARN and rolls into the report.
  # ─────────────────────────────────────────────────────────────────
  bpf-cu:
    name: bpf-bench CU regression
    runs-on: ubuntu-latest
    needs: criterion
    env:
      # bpf-bench loads mosaic_program.so from $BPF_OUT_DIR or $SBF_OUT_DIR.
      # cargo-build-sbf deposits the artifact at target/deploy/ by default.
      BPF_OUT_DIR: ${{ github.workspace }}/target/deploy
      SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: borsh must stay <1.6 (issue #88)
        # borsh 1.6.x panics on the SBF runtime; the bench drives the real
        # .so so it would fail spuriously. Mirror of the ci.yml lock-guard
        # (workflows can't share `needs` across files).
        run: |
          vers="$(awk '/^name = "borsh"$/{getline; gsub(/version = "|"/,""); print}' Cargo.lock)"
          echo "borsh versions: $vers"
          bad=0; have_15=0
          for v in $vers; do
            case "$v" in
              1.5.*) have_15=1 ;;
              1.*) echo "::error::borsh $v panics on the SBF runtime (issue #88)"; bad=1 ;;
              *) ;;
            esac
          done
          [ "$have_15" -eq 1 ] || { echo "::error::no borsh 1.5.x in Cargo.lock"; bad=1; }
          exit $bad
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.15/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build SBF program
        run: cargo build-sbf --tools-version v1.52 --manifest-path crates/mosaic-program/Cargo.toml
      - name: Run CU regression bench (fails on ADR-0005 hard-cap breach)
        # bpf-bench exit codes:
        #   0 = all measurable targets within baseline tolerance + under cap
        #   1 = hard cap exceeded (ADR-0005 breach)
        #   2 = a target that should measure failed to (real signal).
        #       Known-pending fixtures (KNOWN_PENDING_TARGETS, e.g. the
        #       fri_stark large-shape scaffold tracked in #76) are logged
        #       but do NOT trigger exit 2.
        run: cargo run --release -p mosaic-bench --bin bpf-bench

# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
# Strict policy: any change to allowed licenses, banned crates, or sources must
# be PR-reviewed. Security advisories block merges.

[graph]
all-features = false
no-default-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "sbf-solana-solana" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "warn"
allow = []
deny = [
    # Banned cryptography crates — all on-chain crypto must come from arkworks
    # (host backend) or Solana syscalls (SBF backend).
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    # Banned random sources — non-determinism is a consensus-failure attack.
    { name = "rand_os" },
    { name = "getrandom", wrappers = ["ark-std", "rand", "rand_core", "rand_chacha"] },
]
skip = [
    # Arkworks ecosystem version skew is acceptable until 0.6.x ships.
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

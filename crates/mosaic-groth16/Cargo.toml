[package]
name = "mosaic-groth16"
description = "BN254 Groth16 verifier for Solana on-chain programs and host-side testing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mosaic-core = { workspace = true }
# Session 98 — primitive consolidation. Re-exports `BN254_FR_MODULUS_BE`
# and `lt_be` from the shared primitives crate, removing the long-
# standing duplicate definitions that lived in `canonical.rs` since
# session 1.
mosaic-zk-primitives = { workspace = true }
borsh = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
arrayvec = { workspace = true }

[dev-dependencies]
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
proptest = { workspace = true }

[features]
default = []
std = ["mosaic-core/std"]
solana = ["mosaic-core/solana"]
host-backend = ["mosaic-core/host-backend"]
diagnostics = ["mosaic-core/diagnostics"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[package]
name = "mosaic-halo2"
description = "Halo2-KZG verifier over BN254 (Privacy Scaling Explorations fork). Phase-3 scaffold."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mosaic-core = { workspace = true }
# Shared ZK primitives (Fr byte ops, Fr arithmetic, MSM, transcript,
# G1/G2 generator constants) from mosaic-plonk — same reuse pattern
# as mosaic-hyperplonk. When a third Phase-3 crate lands we extract
# these into `mosaic-zk-primitives` (tracked as follow-up refactor).
mosaic-zk-primitives = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }

[dev-dependencies]
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
mosaic-zk-primitives = { workspace = true, features = ["std"] }
ark-bn254 = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-std = { workspace = true, features = ["std"] }
proptest = { workspace = true }

[features]
default = []
std = ["mosaic-core/std", "mosaic-zk-primitives/std"]
solana = ["mosaic-core/solana", "mosaic-zk-primitives/solana"]
host-backend = ["mosaic-core/host-backend", "mosaic-zk-primitives/host-backend"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

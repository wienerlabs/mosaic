[package]
name = "mosaic-sdk"
description = "Client-side Rust SDK for building VerifyProof transactions and pre-flight verifying proofs locally."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
mosaic-groth16 = { workspace = true, features = ["std", "host-backend"] }
mosaic-serde = { workspace = true, features = ["std", "host-backend"] }
mosaic-chunked = { workspace = true, features = ["std"] }

# Session 33: Phase-3 verifier crates gated behind per-system
# features so downstream SDK consumers only pay the compile-time
# cost of the systems they actually preflight. `groth16` is the
# baseline — always compiled, no feature gate needed.
mosaic-plonk = { workspace = true, features = ["std"], optional = true }
mosaic-hyperplonk = { workspace = true, features = ["std"], optional = true }
mosaic-halo2 = { workspace = true, features = ["std"], optional = true }
mosaic-nova = { workspace = true, features = ["std"], optional = true }
mosaic-stark = { workspace = true, features = ["std", "host-backend"], optional = true }

solana-sdk = { workspace = true }
solana-client = { workspace = true }
borsh = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }
borsh = { workspace = true, features = ["std"] }

[features]
# Default ships Groth16 preflight only (baseline behavior pre-
# session-33). Phase-3 systems opt in individually.
default = []
# Enable client-side preflight for KZG-PLONK BN254.
plonk = ["dep:mosaic-plonk"]
# Enable client-side preflight for HyperPlonk-KZG BN254.
hyperplonk = ["dep:mosaic-hyperplonk"]
# Enable client-side preflight for Halo2-KZG BN254 (PSE fork).
halo2 = ["dep:mosaic-halo2"]
# Enable client-side preflight for Nova / HyperNova / ProtoStar.
nova = ["dep:mosaic-nova"]
# Enable client-side preflight for FRI-STARK.
stark = ["dep:mosaic-stark"]
# Convenience: all Phase-3 preflight paths at once.
all-phase3 = ["plonk", "hyperplonk", "halo2", "nova", "stark"]

[lints]
workspace = true

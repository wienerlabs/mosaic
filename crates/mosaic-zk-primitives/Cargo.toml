[package]
name = "mosaic-zk-primitives"
description = "Shared BN254 cryptographic primitives for Mosaic verifiers: Fr arithmetic, MSM, Keccak-256 transcript, G1/G2 generator constants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mosaic-core = { workspace = true }
# Fr arithmetic + G1/G2 encoding on both host and SBF. Same stack
# mosaic-plonk used when these lived there.
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }

[dev-dependencies]
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
tiny-keccak = { workspace = true }
ark-bn254 = { workspace = true, features = ["std"] }
ark-ec = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
ark-std = { workspace = true, features = ["std"] }
# Session 34: property-based testing for the hand-rolled borrow-
# chain arithmetic in fr::sub_r and msm::negate_g1, plus round-trip
# invariants for Fr canonical encode/decode. 1.5 is the current
# stable series; no std feature split needed here since everything
# runs as dev-dep on std.
proptest = "1.5"

[features]
default = []
std = ["mosaic-core/std"]
solana = ["mosaic-core/solana"]
host-backend = ["mosaic-core/host-backend"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

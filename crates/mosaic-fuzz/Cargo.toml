# ───────────────────────────────────────────────────────────────────────
# Session 95 — audit-gate fuzz harnesses (one per ADR-0006 audit gate
# that has a wide-enough algebraic input surface to benefit from fuzz
# coverage). The Phase-2 pairing-identity gates (Groth16 / PLONK) are
# not fuzzed at the gate level — their algebraic surface is just the
# syscall verdict byte, which has zero useful fuzz-discoverable space.
# ───────────────────────────────────────────────────────────────────────


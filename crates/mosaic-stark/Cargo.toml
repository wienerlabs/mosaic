[package]
name = "mosaic-stark"
description = "FRI-STARK verifier (planned, Phase 3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mosaic-core = { workspace = true }

[dev-dependencies]
# Session 36: proptest coverage for Goldilocks field arithmetic +
# FRI fold primitive. mosaic-core needs std + host-backend for the
# test harness (mirrors session 34's zk-primitives setup).
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
proptest = "1.5"

[features]
default = []
std = ["mosaic-core/std"]
solana = ["mosaic-core/solana"]
host-backend = ["mosaic-core/host-backend"]

[lints]
workspace = true

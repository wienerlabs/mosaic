[package]
name = "mosaic-plonk"
description = "BN254 KZG-PLONK verifier (planned, Phase 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mosaic-core = { workspace = true }
# Shared BN254 primitives (Fr arithmetic, MSM, transcript, generator
# constants) extracted to their own crate in v0.5.0 so the four BN254
# verifiers (PLONK + HyperPlonk + Halo2 + Nova) can share them without
# each carrying a mosaic-plonk dependency.
mosaic-zk-primitives = { workspace = true }
# Fr arithmetic + G1/G2 generator constants used directly by PLONK-
# specific modules (canonical, challenges, linearization, verifier).
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }

[dev-dependencies]
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
mosaic-zk-primitives = { workspace = true, features = ["std", "host-backend"] }
tiny-keccak = { workspace = true }
ark-bn254 = { workspace = true, features = ["std"] }
ark-ec = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
ark-std = { workspace = true, features = ["std"] }
proptest = { workspace = true }

[features]
default = []
std = ["mosaic-core/std"]
solana = ["mosaic-core/solana"]
host-backend = ["mosaic-core/host-backend"]

[lints]
workspace = true

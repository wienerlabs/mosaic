[package]
name = "mosaic-plonk"
description = "BN254 KZG-PLONK verifier (planned, Phase 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mosaic-core = { workspace = true }
# Fr arithmetic on both host and SBF. Same crates Light Protocol's
# groth16-solana uses on-chain; verified to compile to SBF target.
# ~200 KB binary impact acceptable under Solana 1 MB program limit.
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }

[dev-dependencies]
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
tiny-keccak = { workspace = true }
ark-bn254 = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
ark-std = { workspace = true, features = ["std"] }

[features]
default = []
std = ["mosaic-core/std"]
solana = ["mosaic-core/solana"]
host-backend = ["mosaic-core/host-backend"]

[lints]
workspace = true

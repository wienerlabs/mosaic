[package]
name = "mosaic-nova"
description = "Nova / HyperNova / ProtoStar folding-scheme verifier over BN254. Phase-3 scaffold."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
mosaic-core = { workspace = true }
# Reuses mosaic-plonk BN254 primitives (Fr arithmetic, MSM, transcript,
# G1/G2 constants) — Nova verification on-chain boils down to one MSM
# + one KZG opening check, structurally identical to the PLONK final
# pairing step. Third consumer after HyperPlonk + Halo2 — this is the
# trigger for the mosaic-zk-primitives extraction (follow-up refactor).
mosaic-zk-primitives = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }

[dev-dependencies]
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
mosaic-zk-primitives = { workspace = true, features = ["std"] }
ark-bn254 = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-std = { workspace = true, features = ["std"] }

[features]
default = []
std = ["mosaic-core/std", "mosaic-zk-primitives/std"]
solana = ["mosaic-core/solana", "mosaic-zk-primitives/solana"]
host-backend = ["mosaic-core/host-backend", "mosaic-zk-primitives/host-backend"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

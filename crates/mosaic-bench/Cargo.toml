[package]
name = "mosaic-bench"
description = "Criterion micro-benchmarks for host-side verification and on-chain CU regression harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
mosaic-core = { workspace = true, features = ["std", "host-backend"] }
mosaic-groth16 = { workspace = true, features = ["std", "host-backend"] }
mosaic-plonk = { workspace = true, features = ["std"] }
mosaic-hyperplonk = { workspace = true, features = ["std"] }
mosaic-halo2 = { workspace = true, features = ["std"] }
mosaic-nova = { workspace = true, features = ["std"] }
mosaic-stark = { workspace = true, features = ["std", "host-backend"] }
mosaic-zk-primitives = { workspace = true, features = ["std", "host-backend"] }
mosaic-serde = { workspace = true, features = ["std", "host-backend"] }
solana-program-test = { workspace = true }
solana-sdk = { workspace = true }
borsh = { workspace = true, features = ["std"] }
anyhow = { workspace = true }
tokio = { workspace = true }
ark-bn254 = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "groth16_host"
harness = false

[[bench]]
name = "phase3_host"
harness = false

# Session 97 — per-audit-gate isolation benches. Complements
# `phase3_host` (which times verifier-end-to-end) with focused
# wall-clock numbers for each ADR-0006 audit gate. See
# `benches/audit_gates_host.rs` for the rationale.
[[bench]]
name = "audit_gates_host"
harness = false

# Session 112 — alt_bn128 compression cost characteristics. Measures
# wall-clock for compress_g1/g2/decompress_g1/g2 + end-to-end VK +
# proof round-trips for Halo2/Groth16/PLONK. Validates the trade-off
# claims in v0.9.5/.7/.8/.9 CHANGELOG entries.
[[bench]]
name = "compression_host"
harness = false

[[bin]]
name = "bpf-bench"
path = "src/bin/bpf_bench.rs"

[lints]
workspace = true
